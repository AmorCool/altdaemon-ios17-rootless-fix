name: Build Rootless Deb

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install dpkg
        run: brew install dpkg

      - name: Build package
        run: sh ./build.sh

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: deb
          path: build/*.deb

      - name: Draft release
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${GITHUB_REF_NAME}" build/*.deb \
            --title "${GITHUB_REF_NAME}" \
            --generate-notes
